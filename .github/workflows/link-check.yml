name: Link Check

on:
  schedule:
    # 每月 1 日 UTC 02:00（北京时间 10:00）自动巡检一次
    - cron: "0 2 1 * *"
  pull_request:
    paths:
      - "README*.md"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links in all README files
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --timeout 20
            --max-retries 2
            --exclude "perplexity\.ai"
            --exclude "tableau\.com"
            --exclude "figma\.com"
            --exclude "dell\.com"
            --exclude "adobe\.com"
            --exclude "amazon\.com"
            --exclude "autodesk\.com"
            --exclude "microsoft\.com/en-us/store/b/education"
            --exclude "c\.duomai\.com"
            --exclude "tb\.j5k6\.com"
            --exclude "navicat\.com"
            README*.md
          fail: false
          output: lychee/out.md

      - name: Fail PR check if broken links are found
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != '0'
        run: |
          cat ./lychee/out.md
          exit 1

      - name: Create or update issue if broken links are found (scheduled/manual)
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔗 定期死链巡检报告 / Monthly Link Check Report"
          EXISTING=$(gh issue list --state open --label "bug" --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file ./lychee/out.md
          else
            gh issue create --title "$TITLE" --label "bug" --body-file ./lychee/out.md
          fi
